    relationship: builds-on
    note: "Mathlib supplies real analysis, finite-set algebra and the Plünnecke–Ruzsa inequality."
status:
  scope: >-
    The universal abelian-group pair bound includes empty sets and torsion.
    The integer pair exponent is an infimum of all constant-free exponents.
    Admissibility requires every K>1, a positive constant depending on K,
    and arbitrarily large finite integer sets. The finite multiscale theorem
    is additionally compared and applies to each fixed K. The paper uses C=1
    in estimates whose Lean statements allow C>0. Twenty modules contain
    the mathematical proof; Solution.lean supplies only interface proofs.
    This prepared upgrade and its interface have not yet been built locally.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
