version: "v0.4"
project:
  name: "Improved sum–difference inequalities in abelian groups"
  description: >-
    For every abelian group and finite X,Y, the constant-free inequality
    |X-Y| <= |X+Y|^lambda holds with lambda = (9451e-3286)/(5378e+787).
    A multiscale transfer gives the upper bound
    (13524e-7359)/(9451e-3286) for the Gyarmati–Hennecart–Ruzsa
    small-sumset exponent. The proof combines a two-copy non-Shannon
    entropy certificate with an explicit limiting array certificate.
  authors: ["Logan J. Kleinwaks"]
  responsible_maintainers: ["Logan J. Kleinwaks"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11B30", "11B75", "94A17"]
sources:
  - title: "Improved sum–difference inequalities in abelian groups"
    authors: ["Logan J. Kleinwaks"]
    type: paper
    location: "paper/sum-difference.pdf in this repository snapshot"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The accompanying manuscript presents the new headline results and the
      same proof as the formalization. The paper and Lean development were
      prepared together; this source relationship does not claim that the
      headline bounds appeared in earlier literature.
  - title: "Sums and differences of finite sets"
    authors: ["Katalin Gyarmati", "François Hennecart", "Imre Z. Ruzsa"]
    type: paper
    id: "https://doi.org/10.7169/facm/1229618749"
    relationship: background
    note: "Definition of the small-sumset exponent and the previous 4/3 upper bound."
  - title: "Information inequalities for five random variables"
    authors: ["E. P. Csirmaz", "L. Csirmaz"]
    type: paper
    id: "https://arxiv.org/abs/2512.23316v2"
    relationship: formalizes
    location: "Theorem 22, equation (31), and the associated conditional-copy proofs"
    note: >-
      The two existing non-Shannon families used as auxiliary lemmas are
      re-proved in Lean. The Matúš family is credited to Matúš (ISIT 2007).
      No new general information inequality is claimed.
  - title: "Entropy and set cardinality inequalities for partition-determined functions"
    authors: ["Mokshay Madiman", "Adam W. Marcus", "Prasad Tetali"]
    type: paper
    id: "https://arxiv.org/abs/0901.0055"
    location: "Corollary 2.6"
    relationship: formalizes
    note: "Independent-sum submodularity, credited to Madiman, is re-proved in Lean."
  - title: "New proofs of Plünnecke-type estimates for product sets in groups"
    authors: ["Giorgis Petridis"]
    type: paper
    id: "https://arxiv.org/abs/1101.3507v3"
    location: "Theorem 1.2"
    relationship: background
    note: "The required Plünnecke–Ruzsa inequality is supplied by the pinned Mathlib dependency."
related_formalizations:
