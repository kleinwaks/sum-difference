      tool_setup: >-
        Research and proof derivation. GPT-6 Astra additionally revised the
        paper under the author's instructions, performed a static correspondence
        and citation review, cleaned comments, and prepared build metadata
        and the Comparator interface.
      prompting_notes: >-
        Prepare the existing bounds for publication without improving them
