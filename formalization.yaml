  reviewers: ["GPT-6 Astra"]
  notes: >-
    Static review checked headline quantifiers, the twenty-file import closure,
    proof correspondence, and citations. Exact arithmetic checked the entropy
    certificate and limiting formulas. The reviewer did not run Lean or
    Comparator. No external human peer review or Palomar acceptance is claimed.
