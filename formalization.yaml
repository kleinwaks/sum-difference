  notes: >-
    Logan J. Kleinwaks is the human author and responsible maintainer.
    AI systems are credited as tools and contributors to the workflow, not
    as authors. The author's final manuscript review and local build are
    still required before this prepared metadata is submitted.
fidelity:
  divergences: >-
    No known mathematical divergence from the accompanying paper.
    Finite group-valued probability laws use finitely supported real group
    algebra elements. DecidableEq is supplied classically and does not
    restrict the groups. Some auxiliary estimates include a positive
    multiplicative constant; the paper specializes it to one. The prepared
    move from Lean 4.28.0 to 4.35.0-rc2 is untested.
